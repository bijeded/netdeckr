<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track Magic: The Gathering metagames from real tournaments." />
    <title>Netdeckr</title>
    <!-- Warm the DNS+TLS connection to Supabase before the JS bundle fires its
         first data query, so the LCP-gating fetch starts sooner. crossorigin
         because supabase-js requests are CORS (auth headers). -->
    <link rel="preconnect" href="https://kxuvvltxyxyuitdzftxg.supabase.co" crossorigin />
    <!-- Fonts loaded here (not via a bundled CSS @import) so the request starts
         immediately in parallel instead of behind the app-CSS → @import waterfall. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional: use the webfont only if it's ready almost immediately,
         otherwise keep the fallback for this load with no swap — guarantees zero
         layout shift (CLS). The font is cached for subsequent visits. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=optional"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
