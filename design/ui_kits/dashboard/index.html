<!-- @dsCard group="Dashboard" viewport="1280x820" -->
<!-- @startingPoint section="Dashboard" subtitle="MetaStack metagame dashboard" viewport="1280x820" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaStack — Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg-app); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:rgba(177,75,255,.28); border-radius:9px; }
  @keyframes pulseGlow { 0%,100%{opacity:.55} 50%{opacity:1} }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { Pill, IconButton, StatCard, ArchetypeCard, ManaPips, ChangeIndicator, tierFor } = window.MetaStack;

    const FORMATS = ['Standard','Pioneer','Modern','Pauper','Pre-Modern'];
    const ARCHS = [
      { name:'Izzet Cauldron', colors:'UR', pct:14.2, delta:2.1, hue:265 },
      { name:'Dimir Midrange', colors:'UB', pct:11.8, delta:-0.9, hue:230 },
      { name:'Mono-Red Aggro', colors:'R', pct:10.4, delta:1.3, hue:14 },
      { name:'Golgari Midrange', colors:'BG', pct:8.1, delta:-1.7, hue:135 },
      { name:'Azorius Control', colors:'WU', pct:6.9, delta:0.4, hue:210 },
      { name:'Domain Ramp', colors:'WUBRG', pct:5.5, delta:-0.2, hue:285 },
      { name:'Boros Convoke', colors:'WR', pct:4.3, delta:0.8, hue:30 },
      { name:'Gruul Aggro', colors:'RG', pct:3.6, delta:-0.5, hue:80 },
    ];
    const TRENDING = [
      ['Cori-Steel Cutter',38.4,31.2],['Monstrous Rage',26.1,27.0],['Torch the Tower',24.8,22.5],
      ['Get Lost',22.3,22.3],['Sheoldred, the Apocalypse',19.7,21.4],['Spyglass Siren',18.9,15.6],
      ['Up the Beanstalk',14.2,14.8],['Stormchaser\u2019s Talent',13.5,9.8],
    ];
    const FILTERS = {
      'Fecha': ['5 días','2 semanas','2 meses'],
      'Tamaño de eventos': ['Todos los eventos','Eventos grandes','Solo MTGO'],
    };

    function Sidebar() {
      const [sel, setSel] = React.useState({ 'Fecha':'5 días', 'Tamaño de eventos':'Todos los eventos' });
      return (
        <aside style={{ flex:'0 0 280px', width:280, borderRight:'1px solid var(--border-hair)', background:'var(--surface-subtle)', overflowY:'auto' }}>
          <div style={{ padding:'18px 18px 28px' }}>
            {Object.entries(FILTERS).map(([group, opts]) => (
              <div key={group} style={{ marginBottom:24 }}>
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:11 }}>
                  <span style={{ fontFamily:'var(--font-display)', fontSize:'var(--fs-2xs)', fontWeight:'var(--fw-bold)', letterSpacing:'var(--track-wide)', textTransform:'uppercase', color:'var(--text-secondary)' }}>{group}</span>
                  <span style={{ flex:1, height:1, background:'var(--border-hair)' }} />
                </div>
                <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
                  {opts.map(o => {
                    const on = sel[group] === o;
                    return (
                      <button key={o} onClick={()=>setSel(s=>({...s,[group]:o}))} style={{
                        display:'flex', alignItems:'center', justifyContent:'space-between', width:'100%', textAlign:'left',
                        padding:'8px 11px', borderRadius:'var(--r-md)', cursor:'pointer', fontFamily:'var(--font-body)', fontSize:'var(--fs-sm)',
                        transition:'all var(--dur-fast) var(--ease)',
                        border:`1px solid ${on?'rgba(177,75,255,.35)':'transparent'}`,
                        background: on?'var(--neon-tint-08)':'transparent', color: on?'var(--text-primary)':'var(--text-secondary)' }}>
                        {o}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
            <div style={{ marginBottom:8 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:11 }}>
                <span style={{ fontFamily:'var(--font-display)', fontSize:'var(--fs-2xs)', fontWeight:'var(--fw-bold)', letterSpacing:'var(--track-wide)', textTransform:'uppercase', color:'var(--text-secondary)' }}>Arquetipo</span>
                <span style={{ flex:1, height:1, background:'var(--border-hair)' }} />
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
                {ARCHS.slice(0,5).map(a => (
                  <button key={a.name} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8, width:'100%', textAlign:'left',
                    padding:'8px 11px', borderRadius:'var(--r-md)', cursor:'pointer', border:'1px solid transparent', background:'transparent', color:'var(--text-secondary)', fontSize:'var(--fs-sm)', fontFamily:'var(--font-body)' }}>
                    <span style={{ display:'flex', alignItems:'center', gap:9 }}><ManaPips colors={a.colors[0]} size={13} />{a.name}</span>
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:'var(--fs-2xs)', color:'var(--text-faint)' }}>{a.pct.toFixed(1)}%</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </aside>
      );
    }

    function App() {
      const [fmt, setFmt] = React.useState('Standard');
      const [sel, setSel] = React.useState(null);
      const maxPct = ARCHS[0].pct;
      return (
        <div style={{ position:'fixed', inset:0, display:'flex', flexDirection:'column',
          background:'radial-gradient(1200px 600px at 80% -10%, rgba(177,75,255,.10), transparent 60%), var(--bg-app)', color:'var(--text-primary)', overflow:'hidden' }}>
          {/* Topbar */}
          <header style={{ flex:'0 0 auto', display:'flex', alignItems:'center', gap:22, height:62, padding:'0 20px', borderBottom:'1px solid var(--border-hair)', background:'rgba(14,15,22,.72)', backdropFilter:'blur(10px)' }}>
            <div style={{ display:'flex', alignItems:'center', gap:11 }}>
              <IconButton>≡</IconButton>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <div style={{ width:26, height:26, borderRadius:7, background:'var(--neon-gradient)', boxShadow:'0 0 14px rgba(177,75,255,.6)', transform:'rotate(45deg)' }} />
                <div style={{ lineHeight:1.05 }}>
                  <div style={{ fontFamily:'var(--font-display)', fontWeight:'var(--fw-heavy)', fontSize:'var(--fs-lg)', letterSpacing:'-.02em' }}>MetaStack</div>
                  <div style={{ fontSize:'var(--fs-3xs)', color:'var(--text-muted)', letterSpacing:'.14em', textTransform:'uppercase', fontWeight:'var(--fw-medium)' }}>MTG Metagame Breakdown</div>
                </div>
              </div>
            </div>
            <div style={{ marginLeft:'auto', display:'flex', gap:8, alignItems:'center', overflowX:'auto', padding:'4px 2px' }}>
              {FORMATS.map(f => <Pill key={f} active={f===fmt} onClick={()=>setFmt(f)}>{f}</Pill>)}
            </div>
          </header>

          <div style={{ flex:'1 1 auto', display:'flex', minHeight:0 }}>
            <Sidebar />
            <main style={{ flex:'1 1 auto', minWidth:0, overflowY:'auto' }}>
              <div style={{ maxWidth:'var(--content-max)', margin:'0 auto', padding:'26px 30px 60px' }}>
                {/* Header */}
                <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:24, flexWrap:'wrap', marginBottom:26 }}>
                  <div>
                    <div style={{ display:'flex', alignItems:'baseline', gap:12 }}>
                      <h1 style={{ fontFamily:'var(--font-display)', fontSize:'var(--fs-hero)', fontWeight:'var(--fw-heavy)', letterSpacing:'var(--track-tight)', lineHeight:1 }}>{fmt}</h1>
                      <span style={{ fontFamily:'var(--font-mono)', fontSize:'var(--fs-xs)', fontWeight:'var(--fw-medium)', color:'var(--neon-500)', border:'1px solid rgba(177,75,255,.4)', background:'var(--neon-tint-08)', padding:'4px 9px', borderRadius:'var(--r-sm)', boxShadow:'0 0 18px rgba(177,75,255,.18)' }}>Últimos 5 días</span>
                    </div>
                    <div style={{ marginTop:11, color:'var(--text-secondary)', fontSize:'13.5px', fontFamily:'var(--font-mono)' }}>24 — 28 Jun 2026</div>
                  </div>
                  <div style={{ display:'flex', gap:10 }}>
                    <StatCard value="34" label="Eventos" />
                    <StatCard value={String(ARCHS.length)} label="Arquetipos" color="var(--neon-text)" />
                    <StatCard value="1,284" label="Decks" color="var(--up)" />
                  </div>
                </div>

                {/* Archetype grid */}
                <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(248px,1fr))', gap:14, marginBottom:40 }}>
                  {ARCHS.map((a,i) => (
                    <ArchetypeCard key={a.name} rank={i+1} {...a} maxPct={maxPct}
                      selected={sel===a.name} onClick={()=>setSel(s=>s===a.name?null:a.name)} />
                  ))}
                </div>

                {/* Trending */}
                <div style={{ border:'1px solid var(--border-soft)', background:'var(--surface-subtle)', borderRadius:'var(--r-2xl)', overflow:'hidden' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:11, padding:'16px 20px', borderBottom:'1px solid var(--border-hair)' }}>
                    <span style={{ width:8, height:8, borderRadius:2, background:'var(--neon-500)', boxShadow:'0 0 10px var(--neon-500)', transform:'rotate(45deg)' }} />
                    <h2 style={{ fontFamily:'var(--font-display)', fontSize:'var(--fs-h2)', fontWeight:'var(--fw-bold)', letterSpacing:'var(--track-snug)' }}>En Tendencia</h2>
                    <span style={{ marginLeft:'auto', fontSize:'var(--fs-xs)', color:'var(--text-muted)' }}>Top 10 · semana a semana</span>
                  </div>
                  {TRENDING.map((t,i) => {
                    const d = +(t[1]-t[2]).toFixed(1);
                    return (
                      <div key={t[0]} style={{ display:'grid', gridTemplateColumns:'34px 1fr 92px 92px 110px', alignItems:'center', padding:'11px 20px', borderBottom:'1px solid rgba(255,255,255,.035)' }}>
                        <span style={{ fontFamily:'var(--font-mono)', fontSize:'var(--fs-xs)', color:'var(--text-faint)' }}>{String(i+1).padStart(2,'0')}</span>
                        <span style={{ fontSize:'var(--fs-base)', fontWeight:'var(--fw-medium)', borderBottom:'1px dashed rgba(177,75,255,.4)', width:'fit-content' }}>{t[0]}</span>
                        <span style={{ textAlign:'right', fontFamily:'var(--font-mono)', fontSize:'13px', fontWeight:'var(--fw-medium)' }}>{t[1].toFixed(1)}%</span>
                        <span style={{ textAlign:'right', fontFamily:'var(--font-mono)', fontSize:'13px', color:'var(--text-muted)' }}>{t[2].toFixed(1)}%</span>
                        <span style={{ textAlign:'right' }}><ChangeIndicator delta={d} /></span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </main>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script>if(!window.__mtgTransformed){window.__mtgTransformed=1;window.Babel&&Babel.transformScriptTags();}</script>
</body>
</html>
