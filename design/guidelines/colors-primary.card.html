<!-- @dsCard group="Colors" viewport="700x130" name="Primary — Violet Neon" subtitle="Brand accent + gradient CTA" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);color:var(--text-primary);padding:22px 26px;display:flex;gap:12px;flex-wrap:wrap}
.sw{width:118px;height:86px;border-radius:11px;border:1px solid var(--border-line);display:flex;flex-direction:column;justify-content:flex-end;padding:9px}
.n{font-family:var(--font-mono);font-size:10px}.v{font-family:var(--font-mono);font-size:10px;opacity:.7}</style></head>
<body>
<div class="sw" style="background:var(--neon-500)"><span class="n">--neon-500</span><span class="v">#b14bff</span></div>
<div class="sw" style="background:var(--neon-600)"><span class="n">--neon-600</span><span class="v">#7a2bff</span></div>
<div class="sw" style="background:var(--neon-gradient);box-shadow:0 0 22px rgba(177,75,255,.4)"><span class="n">--neon-gradient</span><span class="v">CTA glow</span></div>
<div class="sw" style="background:var(--neon-tint-16)"><span class="n">--neon-tint-16</span><span class="v">chip fill</span></div>
<div class="sw" style="background:var(--surface-card);color:var(--neon-text)"><span class="n">--neon-text</span><span class="v">#c79bff</span></div>
</body></html>
