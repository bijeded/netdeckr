<!-- @dsCard group="Brand" viewport="700x150" name="Radius & Elevation" subtitle="Corner radii + card/glow shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-body);padding:22px 26px;display:flex;gap:16px;align-items:center}
.box{width:96px;height:86px;background:var(--surface-card);border:1px solid var(--border-line);display:flex;align-items:flex-end;padding:8px}
.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head>
<body>
<div class="box" style="border-radius:6px"><span class="n">--r-sm 6</span></div>
<div class="box" style="border-radius:11px"><span class="n">--r-lg 11</span></div>
<div class="box" style="border-radius:15px"><span class="n">--r-xl 15</span></div>
<div class="box" style="border-radius:18px"><span class="n">--r-3xl 18</span></div>
<div class="box" style="border-radius:15px;box-shadow:var(--shadow-card)"><span class="n">shadow-card</span></div>
<div class="box" style="border-radius:15px;box-shadow:var(--glow-neon-strong);border-color:var(--neon-border)"><span class="n">glow-neon</span></div>
</body></html>
