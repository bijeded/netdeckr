<!-- @dsCard group="Colors" viewport="700x130" name="Surfaces & Text" subtitle="Dark canvas, cards, hairlines, text ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);color:var(--text-primary);padding:22px 26px;display:flex;gap:12px;flex-wrap:wrap}
.sw{width:104px;height:86px;border-radius:11px;border:1px solid var(--border-line);display:flex;flex-direction:column;justify-content:flex-end;padding:9px}
.n{font-family:var(--font-mono);font-size:10px}.t{font-size:15px;font-weight:600}</style></head>
<body>
<div class="sw" style="background:var(--bg-app)"><span class="n">--bg-app</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="n">--surface-card</span></div>
<div class="sw" style="background:var(--surface-modal)"><span class="n">--surface-modal</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="t" style="color:var(--text-primary)">Aa</span><span class="n">--text-primary</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="t" style="color:var(--text-secondary)">Aa</span><span class="n">--text-secondary</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="t" style="color:var(--text-faint)">Aa</span><span class="n">--text-faint</span></div>
</body></html>
