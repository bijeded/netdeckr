<!-- @dsCard group="Colors" viewport="700x120" name="Semantic — Change & Tiers" subtitle="Rising / falling / flat + tier accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);color:var(--text-primary);padding:22px 26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--font-mono);font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:7px;display:inline-flex;gap:4px}
.tier{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px}</style></head>
<body>
<span class="chip" style="color:var(--up);background:var(--up-tint);border:1px solid var(--up-border)">▲ +2.1</span>
<span class="chip" style="color:var(--down);background:var(--down-tint);border:1px solid var(--down-border)">▼ -1.7</span>
<span class="chip" style="color:var(--flat);background:var(--flat-tint);border:1px solid var(--flat-border)">– 0.0</span>
<span style="width:1px;height:26px;background:var(--border-line)"></span>
<span class="tier" style="color:var(--tier-1);background:var(--neon-tint-16);border:1px solid rgba(177,75,255,.55)">T1</span>
<span class="tier" style="color:var(--tier-2);background:rgba(127,216,255,.12);border:1px solid rgba(127,216,255,.4)">T2</span>
<span class="tier" style="color:var(--tier-3);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)">T3</span>
<span class="tier" style="color:var(--tier-rogue);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12)">Otros</span>
</body></html>
