<!-- @dsCard group="Components" viewport="700x150" name="Mana Pips" subtitle="WUBRG color-identity dots" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--bg-app); color:var(--text-primary); font-family:var(--font-body);
         display:flex; align-items:center; gap:34px; padding:26px 30px; }
  .col { display:flex; flex-direction:column; gap:12px; }
  .lbl { font-family:var(--font-mono); font-size:var(--fs-2xs); color:var(--text-faint);
         text-transform:uppercase; letter-spacing:var(--track-caps); }
  .row { display:flex; align-items:center; gap:14px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { ManaPip, ManaPips } = window.MetaStack;
    function Demo() {
      return (
        <div style={{ display:'flex', gap:34, alignItems:'center' }}>
          <div className="col">
            <span className="lbl">Single pips</span>
            <div className="row">
              {['W','U','B','R','G'].map(c => <ManaPip key={c} color={c} size={22} />)}
            </div>
          </div>
          <div className="col">
            <span className="lbl">Color identities</span>
            <div className="row"><ManaPips colors="UR" size={18} /><ManaPips colors="WU" size={18} /><ManaPips colors="BG" size={18} /><ManaPips colors="WUBRG" size={18} /></div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
  <script>if(!window.__mtgTransformed){window.__mtgTransformed=1;window.Babel&&Babel.transformScriptTags();}</script>
</body>
</html>
