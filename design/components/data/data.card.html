<!-- @dsCard group="Components" viewport="700x180" name="Data: Tiers, Deltas, Stats" subtitle="Tier badges, change chips, stat cards" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style> body { margin:0; background:var(--bg-app); color:var(--text-primary); font-family:var(--font-body); padding:24px 30px; }
  .col { display:flex; flex-direction:column; gap:11px; }
  .lbl { font-family:var(--font-mono); font-size:var(--fs-2xs); color:var(--text-faint); text-transform:uppercase; letter-spacing:var(--track-caps); }
  .row { display:flex; align-items:center; gap:10px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { TierBadge, ChangeIndicator, StatCard } = window.MetaStack;
    function Demo() {
      return (
        <div style={{ display:'flex', gap:40, alignItems:'flex-start' }}>
          <div className="col"><span className="lbl">Tiers</span>
            <div className="row"><TierBadge tier="T1"/><TierBadge tier="T2"/><TierBadge tier="T3"/><TierBadge tier="Otros"/></div>
          </div>
          <div className="col"><span className="lbl">Cambio</span>
            <div className="row"><ChangeIndicator delta={2.1}/><ChangeIndicator delta={-0.9}/><ChangeIndicator delta={0}/></div>
          </div>
          <div className="col"><span className="lbl">Stat cards</span>
            <div className="row"><StatCard value="34" label="Eventos"/><StatCard value="12" label="Arquetipos" color="var(--neon-text)"/><StatCard value="1,284" label="Decks" color="var(--up)"/></div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
  <script>if(!window.__mtgTransformed){window.__mtgTransformed=1;window.Babel&&Babel.transformScriptTags();}</script>
</body>
</html>
