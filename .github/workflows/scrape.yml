name: Daily scrape

on:
  schedule:
    # Daily at 12:00 UTC (see CLAUDE.md → Data pipeline).
    - cron: '0 12 * * *'
  # Manual trigger — used to seed the database on demand.
  workflow_dispatch:

# The job only checks out code; it needs no write access to the repo.
permissions:
  contents: read

# Never run more than one scrape at a time.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper/run.py
