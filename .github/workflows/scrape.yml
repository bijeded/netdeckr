name: Daily scrape

on:
  schedule:
    # One format per staggered slot (UTC) to spread load on MTGTop8. The slot ->
    # format mapping lives in the "Resolve format" step below; keep them in sync.
    - cron: '0 12 * * *'   # ST   (Standard)
    - cron: '15 12 * * *'  # PI   (Pioneer)
    - cron: '30 12 * * *'  # MO   (Modern)
    - cron: '45 12 * * *'  # PAU  (Pauper)
    - cron: '0 13 * * *'   # PREM (Pre-Modern)
  # Manual trigger — seed on demand. A fixed choice (not free text) so the value
  # is constrained to known codes and can never inject into the shell steps below.
  workflow_dispatch:
    inputs:
      format:
        description: 'Format to scrape'
        type: choice
        default: 'all'
        options:
          - all
          - ST
          - PI
          - MO
          - PAU
          - PREM
          # One-time maintenance passes (re-resolve existing rows, no scrape):
          - backfill            # fill card metadata (type_line/rarity/cmc/released_at) + art_crop
          - backfill-scryfall   # fill Scryfall identity/image on rows still missing it

# The job only checks out code; it needs no write access to the repo.
permissions:
  contents: read

# Never run the same format's scrape twice at once; different formats may overlap.
concurrency:
  group: daily-scrape-${{ github.event.schedule || github.event.inputs.format || 'all' }}
  cancel-in-progress: false

jobs:
  scrape:
    name: scrape
    runs-on: ubuntu-latest
    # Generous ceiling for the first (backfill) run; incremental daily runs finish
    # in minutes because already-stored events are skipped.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Resolve format
        id: fmt
        # Values come in via env (never inlined into the script) to avoid any shell
        # interpolation of event data. A scheduled run with an unmapped cron fails
        # loudly rather than silently falling back to a full "all" backfill.
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_FORMAT: ${{ github.event.inputs.format }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              "0 12 * * *")  FMT=ST ;;
              "15 12 * * *") FMT=PI ;;
              "30 12 * * *") FMT=MO ;;
              "45 12 * * *") FMT=PAU ;;
              "0 13 * * *")  FMT=PREM ;;
              *) echo "Unmapped schedule '$SCHEDULE' — update the case to match on.schedule" >&2; exit 1 ;;
            esac
          else
            FMT="${INPUT_FORMAT:-all}"
          fi
          echo "format=$FMT" >> "$GITHUB_OUTPUT"

      - name: Resolve Scryfall cache date
        id: scryfall
        # UTC date matches the scraper's cache key (default_cards-<UTC date>.json),
        # so the bulk file is shared across the day's staggered per-format runs.
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Scryfall bulk data
        # First run of the UTC day downloads the ~500MB default_cards file inside
        # the scraper; later per-format runs (15 min apart) restore it here and
        # skip the download. If the first run outlasts the stagger a later run may
        # re-download — harmless (dated filename, best-effort resolver). No
        # restore-keys: a stale prior-day file must not be restored.
        uses: actions/cache@v4
        with:
          path: scraper/.cache/scryfall
          key: scryfall-bulk-${{ steps.scryfall.outputs.date }}

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMT: ${{ steps.fmt.outputs.format }}
        run: |
          case "$FMT" in
            all)               python scraper/run.py ;;
            backfill)          python scraper/run.py --backfill ;;
            backfill-scryfall) python scraper/run.py --backfill-scryfall ;;
            *)                 python scraper/run.py "$FMT" ;;
          esac
