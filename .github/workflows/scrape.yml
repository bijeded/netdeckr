name: Daily scrape

on:
  schedule:
    # Twice daily (~12 h apart), one format per staggered slot (UTC) to spread load
    # on MTGTop8. The slot -> format mapping lives in the "Resolve format" step
    # below; keep the two lists in lockstep (an unmapped cron fails the run).
    #
    # Targets 6:00 AM / 6:00 PM UTC-6 (a fixed offset — no DST). GitHub schedules
    # cron jobs LATE and variably (observed ~2-4 h on this repo), so the bands are
    # set ~2 h EARLIER than the desired landing to bias actual runs toward target:
    # 10:00 UTC aims to land ~12:00 UTC (~6 AM), 22:00 UTC aims to land ~00:00 UTC
    # (~6 PM). Do NOT "correct" these to 12:00/00:00 — that pushes runs ~2 h late.
    # Morning band (~6 AM UTC-6):
    - cron: '0 10 * * *'   # ST   (Standard)
    - cron: '15 10 * * *'  # PI   (Pioneer)
    - cron: '30 10 * * *'  # MO   (Modern)
    - cron: '45 10 * * *'  # PAU  (Pauper)
    - cron: '0 11 * * *'   # PREM (Pre-Modern)
    # Evening band (~6 PM UTC-6):
    - cron: '0 22 * * *'   # ST   (Standard)
    - cron: '15 22 * * *'  # PI   (Pioneer)
    - cron: '30 22 * * *'  # MO   (Modern)
    - cron: '45 22 * * *'  # PAU  (Pauper)
    - cron: '0 23 * * *'   # PREM (Pre-Modern)
  # Manual trigger — seed on demand. A fixed choice (not free text) so the value
  # is constrained to known codes and can never inject into the shell steps below.
  workflow_dispatch:
    inputs:
      format:
        description: 'Format to scrape'
        type: choice
        default: 'all'
        options:
          - all
          - ST
          - PI
          - MO
          - PAU
          - PREM
          # One-time maintenance passes (re-resolve existing rows, no scrape):
          - backfill            # fill card metadata (type_line/rarity/cmc/released_at) + art_crop
          - backfill-scryfall   # fill Scryfall identity/image on rows still missing it
          - remap-scryfall      # re-resolve ALL rows so resolver heuristic changes reach existing data
          - refresh-color-identity  # recompute archetype color identity from already-mapped rows
          - backfill-sizes      # fill events.player_count from event pages (one-time)
          - backfill-small-images   # fill deck_cards.small_image_url for the decklist image view

# The job only checks out code; it needs no write access to the repo.
permissions:
  contents: read

# Never run the same format's scrape twice at once; different formats may overlap.
concurrency:
  group: daily-scrape-${{ github.event.schedule || github.event.inputs.format || 'all' }}
  cancel-in-progress: false

jobs:
  scrape:
    name: scrape
    runs-on: ubuntu-latest
    # Generous ceiling for the first (backfill) run; incremental daily runs finish
    # in minutes because already-stored events are skipped.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Resolve format
        id: fmt
        # Values come in via env (never inlined into the script) to avoid any shell
        # interpolation of event data. A scheduled run with an unmapped cron fails
        # loudly rather than silently falling back to a full "all" backfill.
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_FORMAT: ${{ github.event.inputs.format }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              # Morning band (~6 AM UTC-6)
              "0 10 * * *")  FMT=ST ;;
              "15 10 * * *") FMT=PI ;;
              "30 10 * * *") FMT=MO ;;
              "45 10 * * *") FMT=PAU ;;
              "0 11 * * *")  FMT=PREM ;;
              # Evening band (~6 PM UTC-6)
              "0 22 * * *")  FMT=ST ;;
              "15 22 * * *") FMT=PI ;;
              "30 22 * * *") FMT=MO ;;
              "45 22 * * *") FMT=PAU ;;
              "0 23 * * *")  FMT=PREM ;;
              *) echo "Unmapped schedule '$SCHEDULE' — update the case to match on.schedule" >&2; exit 1 ;;
            esac
          else
            FMT="${INPUT_FORMAT:-all}"
          fi
          echo "format=$FMT" >> "$GITHUB_OUTPUT"

      - name: Resolve Scryfall cache date
        id: scryfall
        # UTC date matches the scraper's cache key (default_cards-<UTC date>.jsonl.gz),
        # so the bulk file is shared across the day's staggered per-format runs.
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Scryfall bulk data
        # First run of the UTC day downloads the ~77MB gzipped default_cards file
        # inside the scraper; later per-format runs (15 min apart) restore it here
        # and skip the download. If the first run outlasts the stagger a later run
        # may re-download — harmless (dated filename). No restore-keys: a stale
        # prior-day file must not be restored.
        #
        # The -v2 prefix retires entries written while the bulk sync was broken:
        # those runs cached an *empty* directory, so a same-day cache "hit"
        # restored nothing and the download was skipped anyway.
        uses: actions/cache@v4
        with:
          path: scraper/.cache/scryfall
          key: scryfall-bulk-v2-${{ steps.scryfall.outputs.date }}

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMT: ${{ steps.fmt.outputs.format }}
        run: |
          case "$FMT" in
            all)               python scraper/run.py ;;
            backfill)          python scraper/run.py --backfill ;;
            backfill-scryfall) python scraper/run.py --backfill-scryfall ;;
            remap-scryfall)    python scraper/run.py --remap-scryfall ;;
            refresh-color-identity) python scraper/run.py --refresh-color-identity ;;
            backfill-sizes)    python scraper/run.py --backfill-sizes ;;
            backfill-small-images) python scraper/run.py --backfill-small-images ;;
            *)                 python scraper/run.py "$FMT" ;;
          esac
